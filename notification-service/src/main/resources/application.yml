server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888"
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    # Producer/consumer use String (de)serializers by default.
    # Switch to JSON (de)serializers when you implement the events.
  mail:
    host: localhost
    port: 1025        # MailHog SMTP. Web UI: http://localhost:8025

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
