server:
  port: 8087

spring:
  application:
    name: review-service
  config:
    import: "optional:configserver:http://localhost:8888"
  mongodb:
    uri: mongodb://localhost:27017/review_db
  data:
    mongodb:
      uri: mongodb://localhost:27017/review_db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
