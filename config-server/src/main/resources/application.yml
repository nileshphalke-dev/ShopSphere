server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Config files served to all services live in src/main/resources/configs.
          # Later you can switch to Git: spring.cloud.config.server.git.uri
          search-locations: classpath:/configs

management:
  endpoints:
    web:
      exposure:
        include: health,info
