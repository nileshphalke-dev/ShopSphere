# Start everything:        docker compose up -d
# Start only what you need: docker compose up -d mysql redis
services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    container_name: shopsphere-redis
    ports:
      - "6379:6379"

  # Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.8.0
    container_name: shopsphere-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mailhog:
    image: mailhog/mailhog
    container_name: shopsphere-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  zipkin:
    image: openzipkin/zipkin
    container_name: shopsphere-zipkin
    ports:
      - "9411:9411"

  mongo:
    image: mongo:7
    container_name: shopsphere-mongo
    ports:
      - "27017:27017"

volumes:
  mysql-data:
